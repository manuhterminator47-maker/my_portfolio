<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name – Software Developer</title>
<meta name="description" content="Portfolio of Your Name, a Python and Django developer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1ED;
  --surface:#FFFFFF;
  --ink:#1B2A2F;
  --muted:#5B6B70;
  --line:#CBD4CF;
  --accent:#0F6B5C;
  --accent-ink:#FFFFFF;
  --mark:#F2B632;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121B1D;--surface:#1A2629;--ink:#E6EEEA;--muted:#9BAAA6;--line:#2E3F42;--accent:#4FC3A8;--accent-ink:#0B1416;--mark:#F2B632;
  }
}
:root[data-theme="dark"]{
  --bg:#121B1D;--surface:#1A2629;--ink:#E6EEEA;--muted:#9BAAA6;--line:#2E3F42;--accent:#4FC3A8;--accent-ink:#0B1416;--mark:#F2B632;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:3px;border-radius:4px}

.layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;max-width:1200px;margin:0 auto}
aside{position:sticky;top:0;height:100vh;padding:56px 40px;display:flex;flex-direction:column;justify-content:space-between}
aside h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,4vw,3.2rem);line-height:1;margin:0 0 14px;letter-spacing:-.02em}
aside h1 span{background:linear-gradient(transparent 62%,var(--mark) 62%)}
.role{font-weight:600;margin:0 0 8px}
.tagline{color:var(--muted);margin:0;max-width:26ch}
nav ul{list-style:none;padding:0;margin:0;display:grid;gap:4px}
nav a{display:block;padding:6px 0;text-decoration:none;color:var(--muted);font-weight:500;border-left:3px solid transparent;padding-left:14px;transition:color .15s,border-color .15s}
nav a:hover,nav a.active{color:var(--ink);border-left-color:var(--accent)}
.side-foot{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.side-foot a{color:var(--muted);font-size:.95rem}
.side-foot a:hover{color:var(--ink)}
#theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}

main{padding:56px 40px 96px 24px;min-width:0}
section{padding:0 0 72px;scroll-margin-top:32px}
h2{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:0 0 28px;letter-spacing:-.01em}
p{margin:0 0 1em;max-width:62ch}

/* Career timeline: education and work on one line */
.timeline{position:relative;margin:0;padding:0;list-style:none}
.timeline::before{content:"";position:absolute;left:112px;top:6px;bottom:6px;width:2px;background:var(--line)}
.entry{display:grid;grid-template-columns:100px 1fr;gap:0 36px;padding-bottom:36px;position:relative}
.entry::before{content:"";position:absolute;left:107px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.entry.edu::before{border-color:var(--mark)}
.when{font-weight:600;color:var(--muted);font-size:.92rem;padding-top:1px;text-align:right}
.entry h3{margin:0;font-family:var(--display);font-size:1.2rem;line-height:1.3}
.org{margin:2px 0 10px;color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;background:var(--accent);color:var(--accent-ink)}
.entry.edu .tag{background:var(--mark);color:#1B2A2F}
.entry ul{margin:0;padding-left:1.1em;max-width:62ch}
.entry li{margin-bottom:6px}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px}
.skills h3{font-size:1rem;margin:0 0 10px;font-family:var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--line);background:var(--surface);padding:3px 12px;border-radius:999px;font-size:.92rem}

.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.project{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column}
.project h3{margin:0 0 8px;font-family:var(--display);font-size:1.2rem}
.project p{color:var(--muted);flex:1}
.project .chips{margin-bottom:14px}
.project .chips span{font-size:.8rem;padding:1px 10px}
.links{display:flex;gap:16px}
.links a{font-weight:600;color:var(--accent)}

.goals{border-left:4px solid var(--mark);padding:4px 0 4px 20px}
.goals p{font-size:1.1rem}

.contact a.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:12px 22px;border-radius:8px;font-weight:600;text-decoration:none}
.contact a.btn:hover{filter:brightness(1.1)}
footer{color:var(--muted);font-size:.9rem;margin-top:48px}

@media (max-width:860px){
  .layout{display:block}
  aside{position:static;height:auto;padding:40px 24px 8px;gap:24px}
  nav{display:none}
  main{padding:24px 24px 72px}
  .side-foot{margin-top:20px}
  .timeline::before{left:6px}
  .entry{grid-template-columns:1fr;padding-left:32px}
  .entry::before{left:1px}
  .when{text-align:left;margin-bottom:4px}
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div>
      <h1 id="name"><span>Your Name</span></h1>
      <p class="role" id="role"></p>
      <p class="tagline" id="tagline"></p>
    </div>
    <nav aria-label="Sections">
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#career">Career</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#goals">Where I'm headed</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <div class="side-foot" id="social"></div>
  </aside>

  <main>
    <section id="about"><h2>About</h2><div id="aboutText"></div></section>
    <section id="career"><h2>Career</h2><ol class="timeline" id="timeline"></ol></section>
    <section id="skills"><h2>Skills</h2><div class="skills" id="skillGrid"></div></section>
    <section id="projects"><h2>Projects</h2><div class="projects" id="projectGrid"></div></section>
    <section id="goals"><h2>Where I'm headed</h2><div class="goals" id="goalsText"></div></section>
    <section id="contact" class="contact">
      <h2>Contact</h2>
      <p id="contactText"></p>
      <a class="btn" id="mailBtn" href="#">Send an email</a>
      <footer>&copy; <span id="year"></span> <span id="footName"></span></footer>
    </section>
  </main>
</div>

<script>
/* ============================================================
   EDIT THIS OBJECT. Everything on the page comes from here.
   ============================================================ */
const DATA = {
  name: "Your Name",
  role: "Python & Django Developer",
  tagline: "I build web apps that are simple to use and easy to maintain.",
  email: "you@example.com",
  social: [
    { label: "GitHub",   url: "https://github.com/your-username" },
    { label: "LinkedIn", url: "https://www.linkedin.com/in/your-username" }
  ],
  about: [
    "I'm a developer based in Nairobi, Kenya. I work mostly with Python and Django on the back end, and I build interfaces with HTML, CSS and React.",
    "I like turning messy real-world processes into clean, working software. Replace this paragraph with a sentence or two about what drew you to programming."
  ],
  /* type: "work" or "edu". Newest first. */
  career: [
    {
      type: "work", when: "2025 – Present", title: "Junior Developer",
      org: "Company Name, City",
      points: [
        "Built and maintained Django features used by real customers.",
        "Wrote REST endpoints and connected them to a React front end.",
        "Replace these with your own achievements. Use numbers where you can."
      ]
    },
    {
      type: "work", when: "2024", title: "Software Intern",
      org: "Company Name, City",
      points: [
        "Fixed bugs and wrote tests for an existing Python codebase.",
        "Helped design a database schema for a small internal tool."
      ]
    },
    {
      type: "edu", when: "2021 – 2025", title: "BSc Computer Science",
      org: "University Name",
      points: [
        "Relevant courses: Data Structures, Databases, Web Development.",
        "Final-year project: short description of what you built."
      ]
    },
    {
      type: "edu", when: "2020", title: "Certificate in Web Development",
      org: "Institution or online platform",
      points: []
    }
  ],
  skills: [
    { group: "Back end",  items: ["Python", "Django", "REST APIs", "SQL"] },
    { group: "Front end", items: ["HTML", "CSS", "JavaScript", "React"] },
    { group: "Tools",     items: ["Git", "GitHub", "Linux", "VS Code"] }
  ],
  projects: [
    {
      title: "Project One",
      text: "A one-sentence description of what it does and who it is for.",
      stack: ["Django", "PostgreSQL"],
      live: "", repo: "https://github.com/your-username/project-one"
    },
    {
      title: "Project Two",
      text: "Describe the problem you solved and one thing you are proud of.",
      stack: ["React", "REST API"],
      live: "", repo: "https://github.com/your-username/project-two"
    },
    {
      title: "Project Three",
      text: "Even a small tool counts. Show how you think and how you finish things.",
      stack: ["Python"],
      live: "", repo: "https://github.com/your-username/project-three"
    }
  ],
  goals: [
    "Over the next few years I want to grow into a full-stack engineer who can own a feature from database to browser.",
    "I'm looking for a team where I can learn from senior developers and ship work that people use."
  ],
  contactText: "I'm open to junior roles, internships and freelance projects. The quickest way to reach me is email."
};

/* ---------------- rendering (no need to edit below) ---------------- */
const $ = id => document.getElementById(id);
const el = (tag, props = {}, kids = []) => {
  const n = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => k === "text" ? n.textContent = v : n.setAttribute(k, v));
  kids.forEach(k => n.append(k));
  return n;
};

document.title = `${DATA.name} – ${DATA.role}`;
$("name").firstElementChild.textContent = DATA.name;
$("role").textContent = DATA.role;
$("tagline").textContent = DATA.tagline;
$("footName").textContent = DATA.name;
$("year").textContent = new Date().getFullYear();

DATA.social.forEach(s => $("social").append(el("a", { href: s.url, target: "_blank", rel: "noopener", text: s.label })));
$("social").append(el("button", { id: "theme", type: "button", text: "Dark / light" }));

DATA.about.forEach(t => $("aboutText").append(el("p", { text: t })));
DATA.goals.forEach(t => $("goalsText").append(el("p", { text: t })));
$("contactText").textContent = DATA.contactText;
$("mailBtn").href = "mailto:" + DATA.email;

DATA.career.forEach(c => {
  const body = el("div", {}, [
    el("h3", {}, [document.createTextNode(c.title), el("span", { class: "tag", text: c.type === "edu" ? "Education" : "Work" })]),
    el("div", { class: "org", text: c.org })
  ]);
  if (c.points && c.points.length) body.append(el("ul", {}, c.points.map(p => el("li", { text: p }))));
  $("timeline").append(el("li", { class: "entry " + c.type }, [el("div", { class: "when", text: c.when }), body]));
});

DATA.skills.forEach(g => $("skillGrid").append(el("div", {}, [
  el("h3", { text: g.group }),
  el("div", { class: "chips" }, g.items.map(i => el("span", { text: i })))
])));

DATA.projects.forEach(p => {
  const links = el("div", { class: "links" });
  if (p.live) links.append(el("a", { href: p.live, target: "_blank", rel: "noopener", text: "Live site" }));
  if (p.repo) links.append(el("a", { href: p.repo, target: "_blank", rel: "noopener", text: "Source code" }));
  $("projectGrid").append(el("article", { class: "project" }, [
    el("h3", { text: p.title }),
    el("p", { text: p.text }),
    el("div", { class: "chips" }, p.stack.map(s => el("span", { text: s }))),
    links
  ]));
});

/* theme toggle */
$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#121B1D";
  root.setAttribute("data-theme", dark ? "light" : "dark");
});

/* highlight current section in nav */
const links = [...document.querySelectorAll("nav a")];
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
  });
}, { rootMargin: "-30% 0px -60% 0px" });
document.querySelectorAll("main section").forEach(s => io.observe(s));
</script>
</body>
</html>
